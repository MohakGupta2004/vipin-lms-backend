basePath: /api/v1
definitions:
  handlers.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handlers.RegisterRequest:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      password:
        type: string
    type: object
  models.Role:
    enum:
    - student
    - instructor
    - admin
    type: string
    x-enum-varnames:
    - RoleStudent
    - RoleInstructor
    - RoleAdmin
  models.User:
    properties:
      email:
        type: string
      firstName:
        type: string
      id:
        type: string
      lastLoginAt:
        type: string
      lastName:
        type: string
      role:
        $ref: '#/definitions/models.Role'
    type: object
  utils.JSONResponse:
    properties:
      data: {}
      message:
        type: string
      status:
        type: string
    type: object
info:
  contact: {}
  description: Backend API for the Vipin LMS platform.
  title: Vipin LMS API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and sets access_token and refresh_token as
        HttpOnly cookies.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Logged in
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Malformed payload or missing required fields
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Log in
      tags:
      - auth
  /auth/refresh:
    post:
      description: |-
        Reads the refresh_token cookie and issues new access_token and refresh_token cookies.
        The refresh_token cookie is sent automatically by the browser after login/register.
      produces:
      - application/json
      responses:
        "202":
          description: Tokens refreshed
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: Missing/invalid refresh token or user not found
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Failed to generate new tokens
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Refresh tokens
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a student account and sets access_token and refresh_token
        as HttpOnly cookies.
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Malformed payload or missing required fields
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "409":
          description: User already exists
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Register a new user
      tags:
      - auth
swagger: "2.0"
