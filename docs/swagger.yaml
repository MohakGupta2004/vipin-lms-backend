basePath: /api/v1
definitions:
  handlers.CreateCourseRequest:
    properties:
      description:
        type: string
      examId:
        type: string
      instructorId:
        description: 'optional: defaults to the admin creating the course'
        type: string
      isFree:
        type: boolean
      shortDescription:
        type: string
      slug:
        type: string
      status:
        description: draft (default), published or archived
        type: string
      title:
        type: string
    type: object
  handlers.CreateEnrollmentRequest:
    properties:
      courseId:
        type: string
      months:
        description: how long the enrollment lasts, like 3
        type: integer
      userId:
        type: string
    type: object
  handlers.CreateLessonRequest:
    properties:
      content:
        description: short description of the chapter
        type: string
      isFree:
        type: boolean
      isPublished:
        description: defaults to true
        type: boolean
      title:
        type: string
    type: object
  handlers.CreateOptionRequest:
    properties:
      isCorrect:
        type: boolean
      optionText:
        type: string
    type: object
  handlers.CreatePostRequest:
    properties:
      content:
        type: string
      courseId:
        type: string
      links:
        items:
          type: string
        type: array
    type: object
  handlers.CreateQuestionRequest:
    properties:
      explanation:
        description: shown to the student after submitting
        type: string
      options:
        items:
          $ref: '#/definitions/handlers.CreateOptionRequest'
        type: array
      questionText:
        type: string
    type: object
  handlers.CreateQuizRequest:
    properties:
      description:
        type: string
      isFree:
        type: boolean
      passPercent:
        description: defaults to 70
        type: integer
      questions:
        items:
          $ref: '#/definitions/handlers.CreateQuestionRequest'
        type: array
      status:
        description: draft or published, defaults to published
        type: string
      timeLimitSec:
        description: omit for an untimed quiz
        type: integer
      title:
        type: string
    type: object
  handlers.ForgotPasswordRequest:
    properties:
      email:
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handlers.RegisterRequest:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      password:
        type: string
    type: object
  handlers.ResetPasswordRequest:
    properties:
      newPassword:
        type: string
      resetToken:
        type: string
    type: object
  handlers.SubmitAnswerRequest:
    properties:
      optionId:
        type: string
      questionId:
        type: string
    type: object
  handlers.SubmitAttemptRequest:
    properties:
      answers:
        items:
          $ref: '#/definitions/handlers.SubmitAnswerRequest'
        type: array
    type: object
  handlers.UpdateCourseRequest:
    properties:
      description:
        type: string
      examId:
        type: string
      isFree:
        type: boolean
      shortDescription:
        type: string
      slug:
        type: string
      title:
        type: string
    type: object
  handlers.UpdateCourseStatusRequest:
    properties:
      status:
        description: draft, published or archived
        type: string
    type: object
  handlers.UpdateEnrollmentStatusRequest:
    properties:
      status:
        description: active, completed, expired or cancelled
        type: string
    type: object
  handlers.UpdateLessonRequest:
    properties:
      content:
        type: string
      isFree:
        type: boolean
      isPublished:
        type: boolean
      title:
        type: string
    type: object
  handlers.UpdateQuizRequest:
    properties:
      description:
        type: string
      isFree:
        type: boolean
      passPercent:
        type: integer
      questions:
        items:
          $ref: '#/definitions/handlers.CreateQuestionRequest'
        type: array
      status:
        type: string
      timeLimitSec:
        type: integer
      title:
        type: string
    type: object
  handlers.UpdateQuizStatusRequest:
    properties:
      status:
        description: draft or published
        type: string
    type: object
  handlers.VerifyOTPRequest:
    properties:
      email:
        type: string
      otp:
        type: string
      purpose:
        enum:
        - email_verification
        - password_reset
        type: string
    type: object
  handlers.VerifyOTPResponse:
    properties:
      resetToken:
        description: ResetToken is returned only for purpose password_reset; send
          it to /auth/reset-password.
        type: string
    type: object
  handlers.VideoProgressResponse:
    properties:
      positionSec:
        type: integer
    type: object
  handlers.VideoResponse:
    properties:
      video:
        $ref: '#/definitions/models.Video'
    type: object
  handlers.VideoStreamResponse:
    properties:
      expiresAt:
        type: string
      manifestUrl:
        type: string
      queryParams:
        type: string
      resumeAt:
        description: seconds; where the user stopped last time, 0 = from the start
        type: integer
    type: object
  handlers.VideoUploadResponse:
    properties:
      expiresAt:
        type: string
      headers:
        additionalProperties:
          type: string
        type: object
      method:
        type: string
      uploadUrl:
        type: string
      video:
        $ref: '#/definitions/models.Video'
    type: object
  handlers.VideosResponse:
    properties:
      videos:
        items:
          $ref: '#/definitions/models.Video'
        type: array
    type: object
  handlers.requestVideoUploadBody:
    properties:
      fileName:
        type: string
      isFree:
        type: boolean
    type: object
  handlers.saveVideoProgressBody:
    properties:
      positionSec:
        type: integer
    type: object
  models.AttemptAnswer:
    properties:
      correctOptionId:
        type: string
      explanation:
        type: string
      isCorrect:
        type: boolean
      questionId:
        type: string
      selectedOptionId:
        description: nil = skipped
        type: string
    type: object
  models.Course:
    properties:
      createdAt:
        type: string
      description:
        type: string
      examId:
        type: string
      id:
        type: string
      instructorId:
        type: string
      isFree:
        type: boolean
      shortDescription:
        type: string
      slug:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  models.Enrollment:
    properties:
      courseId:
        type: string
      enrolledAt:
        type: string
      expiresAt:
        description: null = never expires
        type: string
      id:
        type: string
      source:
        type: string
      status:
        type: string
      userId:
        type: string
    type: object
  models.Exam:
    properties:
      code:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  models.Lesson:
    properties:
      content:
        type: string
      courseId:
        type: string
      createdAt:
        type: string
      id:
        type: string
      isFree:
        type: boolean
      isPublished:
        type: boolean
      lessonType:
        type: string
      notes:
        items:
          $ref: '#/definitions/models.Note'
        type: array
      position:
        type: integer
      title:
        type: string
    type: object
  models.Note:
    properties:
      courseId:
        type: string
      createdAt:
        type: string
      description:
        type: string
      fileName:
        type: string
      id:
        type: string
      lessonId:
        type: string
      sizeBytes:
        type: integer
      title:
        type: string
      uploadedBy:
        type: string
      uploaderName:
        type: string
    type: object
  models.Post:
    properties:
      authorId:
        type: string
      authorName:
        type: string
      content:
        type: string
      courseId:
        type: string
      courseTitle:
        type: string
      createdAt:
        type: string
      id:
        type: string
      links:
        items:
          type: string
        type: array
    type: object
  models.Question:
    properties:
      explanation:
        type: string
      id:
        type: string
      options:
        items:
          $ref: '#/definitions/models.QuestionOption'
        type: array
      position:
        type: integer
      questionText:
        type: string
    type: object
  models.QuestionOption:
    properties:
      id:
        type: string
      isCorrect:
        type: boolean
      optionText:
        type: string
      position:
        type: integer
    type: object
  models.Quiz:
    properties:
      courseId:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      description:
        type: string
      id:
        type: string
      isFree:
        type: boolean
      lessonId:
        type: string
      passPercent:
        type: integer
      questionCount:
        type: integer
      questions:
        items:
          $ref: '#/definitions/models.Question'
        type: array
      status:
        type: string
      timeLimitSec:
        description: nil = untimed
        type: integer
      title:
        type: string
    type: object
  models.QuizAttempt:
    properties:
      answers:
        items:
          $ref: '#/definitions/models.AttemptAnswer'
        type: array
      id:
        type: string
      passed:
        type: boolean
      quizId:
        type: string
      score:
        type: integer
      startedAt:
        type: string
      submittedAt:
        type: string
      total:
        type: integer
      userId:
        type: string
    type: object
  models.Role:
    enum:
    - student
    - instructor
    - admin
    type: string
    x-enum-varnames:
    - RoleStudent
    - RoleInstructor
    - RoleAdmin
  models.User:
    properties:
      email:
        type: string
      emailVerified:
        description: EmailVerified is true once the user has confirmed their email
          with a one-time code.
        type: boolean
      firstName:
        type: string
      id:
        type: string
      lastLoginAt:
        type: string
      lastName:
        type: string
      role:
        $ref: '#/definitions/models.Role'
    type: object
  models.UserSummary:
    properties:
      email:
        type: string
      firstName:
        type: string
      id:
        type: string
      lastName:
        type: string
      role:
        $ref: '#/definitions/models.Role'
    type: object
  models.Video:
    properties:
      courseId:
        type: string
      createdAt:
        type: string
      error:
        type: string
      id:
        type: string
      isFree:
        type: boolean
      lessonId:
        type: string
      sizeBytes:
        type: integer
      status:
        type: string
      title:
        type: string
      updatedAt:
        type: string
    type: object
  utils.JSONResponse:
    properties:
      data: {}
      message:
        type: string
      status:
        type: string
    type: object
info:
  contact: {}
  description: Backend API for the Vipin LMS platform.
  title: Vipin LMS API
  version: "1.0"
paths:
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Emails a 6-digit reset code if the address belongs to an account.
        The response is identical either way, so it does not reveal which addresses
        are registered.
      parameters:
      - description: Account email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: Malformed payload or invalid email
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Request a password reset code
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and sets access_token and refresh_token as
        HttpOnly cookies.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Logged in
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Malformed payload or missing required fields
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      description: |-
        Clears the access_token and refresh_token cookies. Works without a valid session.
        Tokens are stateless JWTs, so a copied token stays valid until it expires.
      produces:
      - application/json
      responses:
        "200":
          description: Logged out
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  type: string
              type: object
      summary: Log out
      tags:
      - auth
  /auth/me:
    get:
      description: Returns the user the access_token cookie belongs to, with their
        current role read from the database.
      produces:
      - application/json
      responses:
        "200":
          description: Logged-in user
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Get the logged-in user
      tags:
      - auth
  /auth/refresh:
    post:
      description: |-
        Reads the refresh_token cookie and issues new access_token and refresh_token cookies.
        The refresh_token cookie is sent automatically by the browser after login/register.
      produces:
      - application/json
      responses:
        "202":
          description: Tokens refreshed
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: Missing/invalid refresh token or user not found
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Failed to generate new tokens
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Refresh tokens
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a student account and sets access_token and refresh_token
        as HttpOnly cookies.
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Malformed payload or missing required fields
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "409":
          description: User already exists
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Register a new user
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Spends the resetToken from /auth/verify-otp. The password must
        be 8 to 72 characters. A confirmation email is sent.
      parameters:
      - description: Reset token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: Malformed payload, weak password, or invalid/expired reset
            token
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Set a new password
      tags:
      - auth
  /auth/verify-email:
    post:
      description: Emails a 6-digit code to the logged-in user's address. The email
        is sent asynchronously. One code per minute; the code is valid for 10 minutes.
      produces:
      - application/json
      responses:
        "202":
          description: Code queued for delivery
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  type: string
              type: object
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "409":
          description: Email already verified
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "503":
          description: Email queue busy, try again shortly
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Send an email verification code
      tags:
      - auth
  /auth/verify-otp:
    post:
      consumes:
      - application/json
      description: purpose=email_verification marks the email verified. purpose=password_reset
        returns a single-use resetToken (valid 10 minutes) for /auth/reset-password.
        A code allows 5 wrong guesses.
      parameters:
      - description: Email, purpose and code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Code accepted
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.VerifyOTPResponse'
              type: object
        "400":
          description: Malformed payload, or wrong, expired or used code
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Verify a one-time code
      tags:
      - auth
  /courses:
    get:
      description: Admin only. Returns all courses that are not deleted, newest first.
      parameters:
      - description: Max courses to return (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Number of courses to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Courses
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Course'
                  type: array
              type: object
        "400":
          description: Invalid limit or offset
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not an admin
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: List courses
      tags:
      - courses
    post:
      consumes:
      - application/json
      description: Admin only. Creates a course. instructorId is optional and defaults
        to the admin, who then owns and manages the course; it may also name an active
        instructor or admin. Status defaults to draft.
      parameters:
      - description: Course details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateCourseRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Course created
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Course'
              type: object
        "400":
          description: Malformed payload or invalid fields
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not an admin
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "409":
          description: Slug already used
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Create a course
      tags:
      - courses
  /courses/{id}:
    delete:
      description: 'Course owner only. Soft delete: the course disappears from every
        list and students lose access. Enrollments are kept unchanged.'
      parameters:
      - description: Course ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Course deleted
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  type: string
              type: object
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not an instructor or admin
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Course not found, or not owned by this user
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Delete a course
      tags:
      - courses
    get:
      description: Admins can read any course and owners their own (drafts included).
        A student can read a published course they have a valid enrollment in. Everyone
        else gets 404.
      parameters:
      - description: Course ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Course
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Course'
              type: object
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Course not found, or not visible to this user
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Get a course
      tags:
      - courses
    patch:
      consumes:
      - application/json
      description: Course owner only. Changes only the fields that are sent. Status
        has its own endpoint.
      parameters:
      - description: Course ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateCourseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Course updated
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Course'
              type: object
        "400":
          description: Malformed payload or invalid fields
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not an instructor or admin
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Course not found, or not owned by this user
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "409":
          description: Slug already used
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Edit a course
      tags:
      - courses
  /courses/{id}/lessons:
    get:
      description: Returns the course's lessons (chapters) in order, each with its
        PDF notes. Only the course instructor and enrolled students can see it. Students
        see published lessons only.
      parameters:
      - description: Course ID
        in: path
        name: id
        required: true
        type: string
