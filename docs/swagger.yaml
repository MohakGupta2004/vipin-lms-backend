basePath: /api/v1
definitions:
  handlers.CreateCourseRequest:
    properties:
      description:
        type: string
      examId:
        type: string
      instructorId:
        type: string
      isFree:
        type: boolean
      shortDescription:
        type: string
      slug:
        type: string
      status:
        description: draft (default), published or archived
        type: string
      title:
        type: string
    type: object
  handlers.CreateEnrollmentRequest:
    properties:
      courseId:
        type: string
      months:
        description: how long the enrollment lasts, like 3
        type: integer
      userId:
        type: string
    type: object
  handlers.CreateLessonRequest:
    properties:
      content:
        description: short description of the chapter
        type: string
      isFree:
        type: boolean
      isPublished:
        description: defaults to true
        type: boolean
      title:
        type: string
    type: object
  handlers.CreatePostRequest:
    properties:
      content:
        type: string
      courseId:
        type: string
      links:
        items:
          type: string
        type: array
    type: object
  handlers.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handlers.RegisterRequest:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      password:
        type: string
    type: object
  handlers.UpdateCourseStatusRequest:
    properties:
      status:
        description: draft, published or archived
        type: string
    type: object
  handlers.UpdateEnrollmentStatusRequest:
    properties:
      status:
        description: active, completed, expired or cancelled
        type: string
    type: object
  models.Course:
    properties:
      createdAt:
        type: string
      description:
        type: string
      examId:
        type: string
      id:
        type: string
      instructorId:
        type: string
      isFree:
        type: boolean
      shortDescription:
        type: string
      slug:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  models.Enrollment:
    properties:
      courseId:
        type: string
      enrolledAt:
        type: string
      expiresAt:
        description: null = never expires
        type: string
      id:
        type: string
      source:
        type: string
      status:
        type: string
      userId:
        type: string
    type: object
  models.Exam:
    properties:
      code:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  models.Lesson:
    properties:
      content:
        type: string
      courseId:
        type: string
      createdAt:
        type: string
      id:
        type: string
      isFree:
        type: boolean
      isPublished:
        type: boolean
      lessonType:
        type: string
      notes:
        items:
          $ref: '#/definitions/models.Note'
        type: array
      position:
        type: integer
      title:
        type: string
    type: object
  models.Note:
    properties:
      courseId:
        type: string
      createdAt:
        type: string
      description:
        type: string
      fileName:
        type: string
      id:
        type: string
      lessonId:
        type: string
      sizeBytes:
        type: integer
      title:
        type: string
      uploadedBy:
        type: string
      uploaderName:
        type: string
    type: object
  models.Post:
    properties:
      authorId:
        type: string
      authorName:
        type: string
      content:
        type: string
      courseId:
        type: string
      courseTitle:
        type: string
      createdAt:
        type: string
      id:
        type: string
      links:
        items:
          type: string
        type: array
    type: object
  models.Role:
    enum:
    - student
    - instructor
    - admin
    type: string
    x-enum-varnames:
    - RoleStudent
    - RoleInstructor
    - RoleAdmin
  models.User:
    properties:
      email:
        type: string
      firstName:
        type: string
      id:
        type: string
      lastLoginAt:
        type: string
      lastName:
        type: string
      role:
        $ref: '#/definitions/models.Role'
    type: object
  utils.JSONResponse:
    properties:
      data: {}
      message:
        type: string
      status:
        type: string
    type: object
info:
  contact: {}
  description: Backend API for the Vipin LMS platform.
  title: Vipin LMS API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and sets access_token and refresh_token as
        HttpOnly cookies.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Logged in
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Malformed payload or missing required fields
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Log in
      tags:
      - auth
  /auth/refresh:
    post:
      description: |-
        Reads the refresh_token cookie and issues new access_token and refresh_token cookies.
        The refresh_token cookie is sent automatically by the browser after login/register.
      produces:
      - application/json
      responses:
        "202":
          description: Tokens refreshed
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: Missing/invalid refresh token or user not found
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Failed to generate new tokens
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Refresh tokens
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a student account and sets access_token and refresh_token
        as HttpOnly cookies.
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Malformed payload or missing required fields
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "409":
          description: User already exists
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Register a new user
      tags:
      - auth
  /courses:
    get:
      description: Admin only. Returns all courses that are not deleted, newest first.
      parameters:
      - description: Max courses to return (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Number of courses to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Courses
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Course'
                  type: array
              type: object
        "400":
          description: Invalid limit or offset
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not an admin
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: List courses
      tags:
      - courses
    post:
      consumes:
      - application/json
      description: Admin only. Creates a course for an instructor. Status defaults
        to draft.
      parameters:
      - description: Course details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateCourseRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Course created
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Course'
              type: object
        "400":
          description: Malformed payload or invalid fields
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not an admin
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "409":
          description: Slug already used
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Create a course
      tags:
      - courses
  /courses/{id}/lessons:
    get:
      description: Returns the course's lessons (chapters) in order, each with its
        PDF notes. Only the course instructor and enrolled students can see it. Students
        see published lessons only.
      parameters:
      - description: Course ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Lessons with notes
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Lesson'
                  type: array
              type: object
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not enrolled in this course
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Course not found
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: List a course's lessons with their notes
      tags:
      - lessons
    post:
      consumes:
      - application/json
      description: 'Instructor adds a lesson to a course they teach. A lesson is a
        chapter: add as many PDF notes to it as needed with POST /lessons/{id}/notes.
        It goes at the end of the course and is published by default.'
      parameters:
      - description: Course ID
        in: path
        name: id
        required: true
        type: string
      - description: Lesson details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateLessonRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Lesson created
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Lesson'
              type: object
        "400":
          description: Malformed payload or invalid fields
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not the instructor of this course
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Course not found
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Create a lesson (chapter)
      tags:
      - lessons
  /courses/{id}/notes:
    get:
      description: Returns the PDF notes of a course, newest first, optionally for
        one lesson. For notes grouped by lesson use GET /courses/{id}/lessons. Only
        the course instructor and enrolled students can see them.
      parameters:
      - description: Course ID
        in: path
        name: id
        required: true
        type: string
      - description: Only notes of this lesson
        in: query
        name: lessonId
        type: string
      - description: Max notes to return (default 50, max 100)
        in: query
        name: limit
        type: integer
      - description: Number of notes to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Notes
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Note'
                  type: array
              type: object
        "400":
          description: Invalid limit, offset or lessonId
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not enrolled in this course
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Course not found
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: List a course's notes
      tags:
      - notes
  /courses/{id}/status:
    patch:
      consumes:
      - application/json
      description: Instructor only. Changes the status of a course the instructor
        teaches.
      parameters:
      - description: Course ID
        in: path
        name: id
        required: true
        type: string
      - description: New status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateCourseStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Course updated
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Course'
              type: object
        "400":
          description: Malformed payload or invalid status
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not an instructor
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Course not found
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Change course status
      tags:
      - courses
  /enrollments:
    get:
      description: Admin only. Newest first. Filter by courseId and/or userId.
      parameters:
      - description: Only this course
        in: query
        name: courseId
        type: string
      - description: Only this student
        in: query
        name: userId
        type: string
      - description: Max results (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Number to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Enrollments
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Enrollment'
                  type: array
              type: object
        "400":
          description: Invalid filter, limit or offset
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not an admin
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: List enrollments
      tags:
      - enrollments
    post:
      consumes:
      - application/json
      description: Admin only. Enrolls a student in a published course for a number
        of months (1 to 60). The expiry date is calculated by the server.
      parameters:
      - description: Enrollment details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateEnrollmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Enrolled
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Enrollment'
              type: object
        "400":
          description: Malformed payload, bad student, or course not published
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not an admin
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "409":
          description: Already enrolled
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Enroll a student
      tags:
      - enrollments
  /enrollments/{id}:
    patch:
      consumes:
      - application/json
      description: Admin only. For example set an enrollment to cancelled.
      parameters:
      - description: Enrollment ID
        in: path
        name: id
        required: true
        type: string
      - description: New status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateEnrollmentStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Enrollment updated
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Enrollment'
              type: object
        "400":
          description: Malformed payload or invalid status
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not an admin
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Enrollment not found
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Change enrollment status
      tags:
      - enrollments
  /exams:
    get:
      description: Returns all active exams, sorted by code. Any logged-in user can
        call this.
      produces:
      - application/json
      responses:
        "200":
          description: Exams
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Exam'
                  type: array
              type: object
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: List exams
      tags:
      - exams
  /lessons/{id}/notes:
    post:
      consumes:
      - multipart/form-data
      description: Instructor uploads a PDF note to a lesson of a course they teach.
        Max 25 MB.
      parameters:
      - description: Lesson ID
        in: path
        name: id
        required: true
        type: string
      - description: Note title (max 200 characters)
        in: formData
        name: title
        required: true
        type: string
      - description: Short description (max 2000 characters)
        in: formData
        name: description
        type: string
      - description: PDF file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Note uploaded
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Note'
              type: object
        "400":
          description: Invalid form, file is not a PDF, or too large
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not an instructor
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Lesson not found, or not in a course this user teaches
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Share a PDF note on a lesson
      tags:
      - notes
  /notes/{id}:
    delete:
      description: Instructor deletes a note they uploaded. The PDF is removed too.
      parameters:
      - description: Note ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Note deleted
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  type: string
              type: object
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not an instructor
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Note not found
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Delete a note
      tags:
      - notes
  /notes/{id}/file:
    get:
      description: Streams the PDF. Only the course instructor and enrolled students
        can download it.
      parameters:
      - description: Note ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: PDF file
          schema:
            type: file
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Note not found, or not visible to this user
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Download a note
      tags:
      - notes
  /posts:
    get:
      description: Returns posts from free courses, courses the user is enrolled in,
        and courses the user teaches. Newest first.
      parameters:
      - description: Max posts to return (default 20, max 50)
        in: query
        name: limit
        type: integer
      - description: Number of posts to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Posts
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Post'
                  type: array
              type: object
        "400":
          description: Invalid limit or offset
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: List my feed
      tags:
      - posts
    post:
      consumes:
      - application/json
      description: Instructor creates a post (with optional links) for one of their
        own courses.
      parameters:
      - description: Post details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreatePostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Post created
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Post'
              type: object
        "400":
          description: Malformed payload or invalid fields
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not an instructor of this course
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Create a post
      tags:
      - posts
  /posts/{id}:
    delete:
      description: Instructor deletes a post they created. Its links are deleted too.
      parameters:
