services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mohak123}
      POSTGRES_DB: ${POSTGRES_DB:-vipin}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./internal/database/migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-mohak123}@db:5432/${POSTGRES_DB:-vipin}?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-mohak123}@db:5432/${POSTGRES_DB:-vipin}?sslmode=disable
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your_secret_key_here}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY:-14m}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY:-7}
      REFRESH_SECRET_KEY: ${REFRESH_SECRET_KEY:-your_refresh_secret_key_here}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
      # PDF uploads work only when GCS_ENABLE=true; otherwise the credentials below are not used.
      GCS_ENABLE: ${GCS_ENABLE:-false}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-vipin-lms}
      # Required when GCS_ENABLE=true (video transcoding)
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      TRANSCODER_LOCATION: ${TRANSCODER_LOCATION:-}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
