            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not an instructor of this course
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Create a post
      tags:
      - posts
  /posts/{id}:
    delete:
      description: Course owner (instructor or admin) deletes any post in their course.
        Its links are deleted too.
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Post deleted
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  type: string
              type: object
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not an instructor
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Post not found
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Delete a post
      tags:
      - posts
  /quizzes/{id}:
    delete:
      description: Course owner (instructor or admin) deletes a quiz. It disappears
        for everyone, but students' past attempts and scores are kept in the database.
      parameters:
      - description: Quiz ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Quiz deleted
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  type: string
              type: object
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not an instructor or admin
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Quiz not found, or not in a course this user owns
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Delete a quiz
      tags:
      - quizzes
    get:
      description: Returns the quiz with its questions and options in order. The instructor
        also gets isCorrect and explanations; students never do before submitting.
      parameters:
      - description: Quiz ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Quiz with questions
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Quiz'
              type: object
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Quiz not found, or not visible to this user
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Get a quiz with its questions
      tags:
      - quizzes
    patch:
      consumes:
      - application/json
      description: Course owner (instructor or admin) changes only the fields that
        are sent. timeLimitSec 0 makes the quiz untimed. Sending questions replaces
        all of them, which is refused once any student has attempted the quiz. Returns
        the quiz with its questions and answers.
      parameters:
      - description: Quiz ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateQuizRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Quiz updated
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Quiz'
              type: object
        "400":
          description: Malformed payload or invalid fields
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not an instructor or admin
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Quiz not found, or not in a course this user owns
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "409":
          description: 'Questions cannot change: the quiz already has attempts'
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Edit a quiz
      tags:
      - quizzes
  /quizzes/{id}/attempts:
    get:
      description: Returns the logged-in student's past attempts at a quiz, newest
        first. Each attempt has its result and, per question, the selected option,
        the correct option and the explanation.
      parameters:
      - description: Quiz ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Attempts
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.QuizAttempt'
                  type: array
              type: object
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not a student
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Quiz not found, or not visible to this user
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: List my attempts at a quiz
      tags:
      - quizzes
    post:
      consumes:
      - application/json
      description: Student sends all answers in one request and gets the graded result
        back, with the correct option and explanation for every question. Questions
        left out count as skipped (wrong). Every submission is saved as a new attempt.
      parameters:
      - description: Quiz ID
        in: path
        name: id
        required: true
        type: string
      - description: Selected option per question
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.SubmitAttemptRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Graded attempt
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.QuizAttempt'
              type: object
        "400":
          description: Malformed payload, or answer not part of this quiz
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not a student
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Quiz not found, or not visible to this user
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Submit answers to a quiz
      tags:
      - quizzes
  /quizzes/{id}/status:
    patch:
      consumes:
      - application/json
      description: Course owner (instructor or admin) publishes a quiz or moves it
        back to draft. Students only see published quizzes.
      parameters:
      - description: Quiz ID
        in: path
        name: id
        required: true
        type: string
      - description: New status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateQuizStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Quiz updated
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Quiz'
              type: object
        "400":
          description: Malformed payload or invalid status
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not an instructor
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Quiz not found, or not in a course this user teaches
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Change quiz status
      tags:
      - quizzes
  /users:
    get:
      description: Admin only. Returns active users sorted by name, for the instructor
        picker (role=instructor) and the student picker (role=student). Never includes
        password data.
      parameters:
      - description: 'student, instructor or admin (default: all)'
        in: query
        name: role
        type: string
      - description: Max users to return (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: Number of users to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Users
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.UserSummary'
                  type: array
              type: object
        "400":
          description: Invalid role, limit or offset
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not an admin
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: List users
      tags:
      - users
  /videos/{id}:
    get:
      description: The uploader (who must still own the course) polls this until status
        is ready or failed.
      parameters:
      - description: Video ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Video
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.VideoResponse'
              type: object
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not an instructor
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Video not found
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Get a video's upload and transcoding status
      tags:
      - videos
  /videos/{id}/confirm:
    post:
      description: Call after the file was PUT to the signed URL. Checks the file
        and starts transcoding in the background; poll GET /videos/{id} until status
        is ready.
      parameters:
      - description: Video ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Transcoding queued
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.VideoResponse'
              type: object
        "400":
          description: File not uploaded yet, empty, or wrong type
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not an instructor
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Video not found
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "409":
          description: Video is not awaiting upload
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "503":
          description: Storage disabled, or transcoding queue busy (retry)
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Confirm a video upload
      tags:
      - videos
  /videos/{id}/hls/{file}:
    get:
      description: 'Public: the signature in the query (from GET /videos/{id}/stream)
        is the credential. Returns the .m3u8 with every URI rewritten to a signed
        URL: child playlists point back here, segments go straight to the CDN. Open
        to any origin.'
      parameters:
      - description: Video ID
        in: path
        name: id
        required: true
        type: string
      - description: Playlist file, e.g. manifest.m3u8
        in: path
        name: file
        required: true
        type: string
      - description: From stream URL
        in: query
        name: URLPrefix
        required: true
        type: string
      - description: From stream URL
        in: query
        name: Expires
        required: true
        type: string
      - description: From stream URL
        in: query
        name: KeyName
        required: true
        type: string
      - description: From stream URL
        in: query
        name: Signature
        required: true
        type: string
      produces:
      - application/vnd.apple.mpegurl
      responses:
        "200":
          description: Playlist
          schema:
            type: string
        "403":
          description: Invalid or expired signature
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Video or playlist not found
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Get a signed HLS playlist
      tags:
      - videos
  /videos/{id}/progress:
    put:
      consumes:
      - application/json
      description: Call every 10-15 seconds while playing and on pause. The next GET
        /videos/{id}/stream returns it as resumeAt and the manifest starts playback
        there. Send 0 when the video ends so it restarts from the beginning.
      parameters:
      - description: Video ID
        in: path
        name: id
        required: true
        type: string
      - description: Position in seconds (0 to 86400)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.saveVideoProgressBody'
      produces:
      - application/json
      responses:
        "200":
          description: Saved
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.VideoProgressResponse'
              type: object
        "400":
          description: Invalid body or position
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Video not found, or not visible to this user
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "409":
          description: Video is not ready yet (owner only)
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Save where the user stopped in a video
      tags:
      - videos
  /videos/{id}/retry:
    post:
      description: Starts a new transcoding job for a video whose status is failed.
        The uploaded file is reused. Poll GET /videos/{id} until status is ready or
        failed.
      parameters:
      - description: Video ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Transcoding queued again
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.VideoResponse'
              type: object
        "400":
          description: Source file is missing
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "403":
          description: Not an instructor
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Video not found
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "409":
          description: Video is not failed
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "503":
          description: Storage disabled, or transcoding queue busy (retry)
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Retry transcoding of a failed video
      tags:
      - videos
  /videos/{id}/stream:
    get:
      description: 'Returns a signed HLS manifest URL, valid for 15 minutes, that
        any HLS player (hls.js, Safari, VLC, the browser address bar) can open as-is:
        every playlist and segment URL inside it is already signed. queryParams is
        the bare signature. Refetch before expiresAt. Free videos in published courses
        are open to any logged-in user; everything else needs the course owner or
        an enrolled student.'
      parameters:
      - description: Video ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Signed URL
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.VideoStreamResponse'
              type: object
        "401":
          description: Not logged in
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "404":
          description: Video not found, or not visible to this user
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "409":
          description: Video is not ready yet (owner only)
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.JSONResponse'
        "503":
          description: Storage disabled
          schema:
            $ref: '#/definitions/utils.JSONResponse'
      summary: Get a signed streaming URL for a video
      tags:
      - videos
swagger: "2.0"
